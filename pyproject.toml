[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-alignment"
version = "0.6.0"
description = "Alignment and reliability research framework for autonomous AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gitcoder12"}
]
keywords = ["ai-alignment", "ai-safety", "autonomous-agents", "reliability", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "streamlit>=1.36",
    "pyyaml>=6.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
viz = [
    "matplotlib>=3.8",
]
gpu = [
    "GPUtil>=1.4",
]

[project.scripts]
ark = "ark.cli:main"
ark-run = "ark.experiments.runner:main"
ark-arena = "ark.experiments.prompt_arena:main"
ark-army = "ark.armies:main"
ark-risk = "ark.threat.existential.core:main"
ark-omelas = "ark.ethics.omelas:main"
ark-harmony = "ark.harmony.core:main"
ark-world = "ark.world.core:main"
ark-robopia = "ark.robopia.core:main"
ark-strategy = "ark.strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
