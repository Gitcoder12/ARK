name: Refresh ARK Research Feed

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ark-research-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and categorize recent research
        run: python scripts/update_research_feed.py
      - name: Commit updated feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_feed.json docs/research-feed.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh ARK research feed"
            git push
          else
            echo "Research feed is already up to date."
          fi
