name: CI

on:
  push:
    branches: ["main", "deep-dive-sprint"]
  pull_request:
    branches: ["main", "deep-dive-sprint"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint source, tests, and Streamlit pages
        run: ruff check src tests pages app.py arkworld.py
      - name: Compile source and Streamlit pages
        run: python -m compileall -q src pages app.py arkworld.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest tests -v --strict-markers

  test-311:
    name: test (3.11)
