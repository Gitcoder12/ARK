name: CI

on:
  push:
    branches: ["main", "deep-dive-sprint", "tower/**"]
  pull_request:
    branches: ["main", "deep-dive-sprint"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint source, tests, and Streamlit pages
        run: ruff check src tests pages app.py arkworld.py
      - name: Compile source and Streamlit pages
        run: python -m compileall -q src pages app.py arkworld.py

  test:
    name: test (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir -p test-results
      - name: Run test suite
        run: pytest tests -v --strict-markers --junitxml=test-results/junit-py313.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-test-evidence-py313
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  test-311:
    name: test (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir -p test-results
      - name: Run test suite
        run: pytest tests -v --strict-markers --junitxml=test-results/junit-py311.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-test-evidence-py311
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  test-312:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir -p test-results
      - name: Run test suite
        run: pytest tests -v --strict-markers --junitxml=test-results/junit-py312.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-test-evidence-py312
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
